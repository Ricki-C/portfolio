<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Ricki Chen</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
</head>
<body>


    <h1>Contact Me</h1>

    <form action="mailto:ruc018@ucsd.edu" method="POST" enctype="text/plain">
        <label for="email">Email:</label>
        <input id="email" type="email" name="email" placeholder="ruc018@ucsd.edu">

        <label for="subject">Subject:</label>
        <input id="subject" name="subject" placeholder="Hello">

        <label for="message">Message:</label>
        <textarea id="message" name="message" placeholder="Sup?"></textarea>

        <button type="submit">Send</button>
    </form>

</body>
</html>
